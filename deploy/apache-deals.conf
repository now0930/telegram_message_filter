# Add these ProxyPass rules INSIDE the existing HTTPS VirtualHost.
# Requires proxy_module and proxy_http_module, and a Docker network shared
# by Apache and telegram_filter_bot. Keep the Authorization header intact.
ProxyRequests Off
ProxyPass "/deals/" "http://telegram_filter_bot:8090/deals/" connectiontimeout=3 timeout=15
ProxyPassReverse "/deals/" "http://telegram_filter_bot:8090/deals/"
<Location "/deals/">
    Require all granted
    LimitRequestBody 32768
</Location>
